[package]
name = "pravaha_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "pravaha_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tokenizers = "0.19"
dashmap = "5"
futures = "0.3"
tokio-stream = "0.1"

