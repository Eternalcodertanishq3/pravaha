[build-system]
requires = ["maturin>=1.4"]
build-backend = "maturin"

[project]
name = "pravaha"
version = "3.3.0"
description = "Pravāha — Full-Stack Autonomous AI Inference Operating System"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Pravaha Contributors"},
]

dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "safetensors>=0.4.0",
    "tokenizers>=0.15.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "textual>=0.50.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.29.0",
    "prometheus-client>=0.20.0",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.0",
    "pypdf>=4.0.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "psutil>=5.9.0",
    "sse-starlette>=1.8.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
quantization = [
    "bitsandbytes>=0.43.0",
    "auto-gptq>=0.7.0",
    "autoawq>=0.2.0",
]
gguf = [
    "llama-cpp-python>=0.2.80",
]
speculative = [
    "accelerate>=0.30.0",
]
structured = [
    "outlines>=0.0.40",
    "lm-format-enforcer>=0.10.0",
]
telemetry = [
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
]
vision = [
    "pillow>=10.0.0",
    "torchvision>=0.17.0",
]
merge = [
    "mergekit>=0.0.3",
]
all = [
    "pravaha[quantization,gguf,speculative,structured,telemetry,vision,merge]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
]

[project.scripts]
pravaha = "pravaha.cli.main:app"

[tool.maturin]
module-name = "pravaha.pravaha_core"
manifest-path = "rust/Cargo.toml"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "S"]
ignore = ["E501", "ANN401", "S110", "S104", "S605", "S311", "ANN201", "ANN202", "E741", "S603", "S607", "F401", "S101", "N812", "S105", "ANN001", "ANN002", "ANN003", "ANN204"]

[tool.mypy]
python_version = "3.12"
# Only disable what genuinely cannot be fixed without huge refactor
disable_error_code = ["import-untyped", "no-untyped-def", "attr-defined", "no-any-return"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "slow: downloads models",
    "gpu: requires CUDA GPU",
    "integration: requires running server",
]
