# Pravaha v3 — Phase 1 Minimal Configuration
# Use this for testing with gpt2 on CPU
model:
  model_path: gpt2
  device: cpu
  quantization: null
  max_seq_len: 1024
  trust_remote_code: false

sampling:
  temperature: 0.7
  top_k: 50
  top_p: 0.9
  max_new_tokens: 128
  repetition_penalty: 1.1

cache:
  block_size: 16
  num_gpu_blocks: 64
  max_sessions: 100

scheduler:
  max_batch_size: 4
  max_waiting: 16

swarm:
  enabled: false

rag:
  enabled: false
