# Pravaha v3.3 — Swarm Default Configuration
# 51 agents: 20 workers + 12 auditors + 10 security + 9 design

swarm:
  enabled: true
  max_iterations: 3
  min_score: 70.0

  # ── Worker Agents (20) ─────────────────────────────────
  agent_roles:
    - planner
    - researcher
    - coder
    - debugger
    - critic
    - validator
    - summarizer
    - expander
    - translator
    - reasoning
    - merger
    - router
    - memory
    - tool
    - judge
    - refiner
    - classifier
    - extractor
    - narrator
    - ensemble

  # ── Audit Agents (12) ──────────────────────────────────
  audit_roles:
    - syntax_audit
    - type_safety
    - security_audit
    - logic_flaw
    - consistency_guard
    - hallucination_hunter
    - edge_case_hunter
    - performance_profiler
    - output_verifier
    - self_reflection
    - test_generator
    - patch_applier
    - regression_guard

  # ── Security Agents (10) ────────────────────────────────
  security_roles:
    - security_audit
    - injection_scanner
    - auth_audit
    - crypto_audit
    - dependency_audit
    - secrets_scanner
    - network_security
    - privilege_audit
    - api_security
    - compliance

  # ── Design Agents (9) ──────────────────────────────────
  design_roles:
    - ui_designer
    - component_builder
    - layout_designer
    - style_designer
    - accessibility_auditor
    - ux_reviewer
    - design_critic
    - prototype_builder
    - design_system

  # ── v3.3: Temperature Profiles ─────────────────────────
  # Agent-specific temperature overrides for optimal behavior
  temperature_profiles:
    # Creative agents: higher temperature for diversity
    creative:
      temperature: 0.8
      top_p: 0.95
      agents: [narrator, expander, ui_designer, prototype_builder]

    # Analytical agents: lower temperature for precision
    analytical:
      temperature: 0.2
      top_p: 0.9
      agents: [coder, debugger, validator, syntax_audit, type_safety]

    # Reasoning agents: balanced temperature
    reasoning:
      temperature: 0.5
      top_p: 0.92
      agents: [planner, reasoning, critic, judge, logic_flaw]

    # Security agents: very low temperature for accuracy
    security:
      temperature: 0.1
      top_p: 0.85
      agents: [security_audit, injection_scanner, crypto_audit, auth_audit]

  # ── v3.3: Token Budgets ────────────────────────────────
  # Per-agent token limits to control inference costs
  token_budgets:
    default: 1024
    overrides:
      planner: 2048
      researcher: 2048
      coder: 4096
      debugger: 2048
      expander: 2048
      narrator: 2048
      summarizer: 512
      classifier: 256
      router: 256
      validator: 512
      syntax_audit: 256
      type_safety: 256
      security_audit: 512
      output_verifier: 512

  # ── Pipelines ──────────────────────────────────────────
  default_pipeline: plan-execute-audit

  pipelines:
    plan-execute-audit:
      workers: [planner, coder, critic]
      auditors: [syntax_audit, security_audit, output_verifier]

    research-write:
      workers: [researcher, expander, narrator]
      auditors: [hallucination_hunter, output_verifier]

    code-review:
      workers: [coder, debugger, refiner]
      auditors: [syntax_audit, type_safety, security_audit, edge_case_hunter, test_generator]

    secure-code-review:
      workers: [planner, coder, debugger]
      auditors: [syntax_audit, security_audit, injection_scanner, auth_audit,
                 crypto_audit, secrets_scanner, output_verifier, patch_applier]

    design-component:
      workers: [ui_designer, layout_designer, style_designer, component_builder]
      auditors: [accessibility_auditor, ux_reviewer, design_critic, output_verifier]

    full-secure-design:
      workers: [planner, ui_designer, component_builder, coder, debugger]
      auditors: [syntax_audit, security_audit, injection_scanner, secrets_scanner,
                 accessibility_auditor, design_critic, output_verifier, patch_applier]

    full-pipeline:
      workers: [classifier, planner, researcher, coder, critic, refiner, merger]
      auditors: [syntax_audit, type_safety, security_audit, logic_flaw,
                 hallucination_hunter, edge_case_hunter, performance_profiler,
                 output_verifier, patch_applier]

  # ── v3.3: DAG Pipeline Support ─────────────────────────
  # Enable parallel execution for compatible pipelines
  dag_execution:
    enabled: true
    max_parallel: 4
    # Pipelines that can benefit from DAG parallelism
    dag_pipelines:
      - full-pipeline
      - secure-code-review
      - full-secure-design
